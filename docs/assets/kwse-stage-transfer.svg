<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Downstream-to-upstream stage transfer</title>
  <desc id="desc">A three-panel schematic separates an upstream target model, a grid-mapping and stage-calculation step, and a downstream source scenario. River flow points downstream from left to right, while the scenario dependency points upstream from right to left. A bottom strip separates planning, execution, and observation responsibilities.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <style>
      .heading { font: 700 25px system-ui, sans-serif; fill: #0f172a; }
      .panelTitle { font: 700 19px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 600 16px system-ui, sans-serif; fill: #0f172a; }
      .body { font: 15px system-ui, sans-serif; fill: #1e293b; }
      .small { font: 13px system-ui, sans-serif; fill: #334155; }
      .mono { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .panel { fill: #ffffff; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="48" class="heading">Downstream evidence supplies an upstream stage boundary</text>

  <rect x="55" y="78" width="1090" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="108" class="label">Scenario dependency</text>
  <path d="M1035 128 H165" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="445" y="116" class="body">completed downstream scenario supplies the upstream boundary</text>
  <text x="80" y="148" class="small">Information moves upstream; river flow moves downstream.</text>

  <rect x="55" y="195" width="320" height="350" rx="16" class="panel" stroke="#2563eb"/>
  <text x="80" y="230" class="panelTitle">1. Upstream target model</text>
  <text x="80" y="258" class="body">Fixed-discharge inflow</text>
  <text x="80" y="282" class="body">Transferred-stage boundary</text>
  <text x="80" y="306" class="body">Documented outflow condition</text>

  <rect x="92" y="340" width="230" height="135" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <path d="M92 385 H322 M138 340 V475 M184 340 V475 M230 340 V475 M276 340 V475" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="184" y="385" width="46" height="45" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
  <path d="M207 398 l9 9 -9 9 -9 -9 z" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
  <text x="80" y="505" class="small">Mapped interface cell receives one</text>
  <text x="80" y="525" class="small">cell-specific specified stage.</text>

  <rect x="440" y="195" width="320" height="350" rx="16" class="panel" stroke="#7c3aed"/>
  <text x="465" y="230" class="panelTitle">2. Map and calculate</text>
  <text x="465" y="260" class="label">Shared map coordinate</text>

  <rect x="478" y="286" width="90" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <circle cx="523" cy="331" r="7" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <rect x="548" y="326" width="68" height="68" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <path d="M582 348 l9 9 -9 9 -9 -9 z" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
  <text x="632" y="309" class="small">source cell</text>
  <text x="632" y="333" class="small">target cell</text>
  <text x="632" y="357" class="small">query point</text>

  <text x="465" y="425" class="mono">source WSE = terrain + depth</text>
  <text x="465" y="452" class="mono">target WSE = (1-w)L + wU</text>
  <text x="465" y="482" class="small">Use common wet support only.</text>
  <text x="465" y="503" class="small">Reject inadequate interface coverage.</text>
  <text x="465" y="524" class="small">Record grids, datums, masks, and weights.</text>

  <rect x="825" y="195" width="320" height="350" rx="16" class="panel" stroke="#16a34a"/>
  <text x="850" y="230" class="panelTitle">3. Downstream source</text>
  <text x="850" y="258" class="body">Accepted source scenarios</text>
  <text x="850" y="282" class="body">Depth and terrain fields</text>
  <text x="850" y="306" class="body">Stage coordinates and masks</text>

  <rect x="862" y="340" width="230" height="135" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <path d="M862 385 H1092 M908 340 V475 M954 340 V475 M1000 340 V475 M1046 340 V475" stroke="#86efac" stroke-width="1.5"/>
  <rect x="954" y="385" width="46" height="45" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
  <circle cx="977" cy="407" r="7" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <text x="850" y="505" class="small">Observe source records and artifacts</text>
  <text x="850" y="525" class="small">before transfer values are trusted.</text>

  <text x="70" y="586" class="label">Physical river flow</text>
  <path d="M205 580 H995" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <rect x="55" y="620" width="1090" height="105" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="418" y1="635" x2="418" y2="710" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="782" y1="635" x2="782" y2="710" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="651" class="label">Plan</text>
  <text x="80" y="679" class="small">Choose discharge, stage target,</text>
  <text x="80" y="700" class="small">source scenarios, and masks.</text>
  <text x="445" y="651" class="label">Execute</text>
  <text x="445" y="679" class="small">Construct the exact boundary,</text>
  <text x="445" y="700" class="small">run the scenario, publish records.</text>
  <text x="810" y="651" class="label">Observe</text>
  <text x="810" y="679" class="small">Verify identities, artifacts,</text>
  <text x="810" y="700" class="small">integrity, and materialization.</text>
</svg>
