<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">KWSE downstream-to-upstream stage transfer</title>
  <desc id="desc">Two overlapping hydraulic model domains use different grid origins and resolutions. One shared map query coordinate lies inside a blue upstream transfer cell and a larger offset green downstream containing cell. The sampled downstream cell center and water surface value are distinct from the shared query and the upstream cell center. River flow points downstream while scenario dependency points upstream. Labels separate planning, downstream scenario production, upstream job execution, and storage observation.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <pattern id="up-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#bfdbfe" stroke-width="1"/>
    </pattern>
    <pattern id="down-grid" x="6" y="13" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#86efac" stroke-width="1.5"/>
    </pattern>
    <style>
      .heading { font: 700 24px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 600 17px system-ui, sans-serif; fill: #0f172a; }
      .body { font: 15px system-ui, sans-serif; fill: #1e293b; }
      .small { font: 13px system-ui, sans-serif; fill: #334155; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="48" class="heading">Downstream hydraulic evidence becomes an upstream KWSE boundary</text>

  <rect x="55" y="82" width="1090" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="113" class="label">Scenario dependency direction</text>
  <path d="M930 130 H295" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="474" y="119" class="body">completed downstream scenario supplies upstream boundary</text>
  <text x="80" y="151" class="small">This arrow is an information dependency, not river-flow direction.</text>

  <rect x="80" y="205" width="610" height="370" rx="18" fill="url(#up-grid)" stroke="#2563eb" stroke-width="4"/>
  <text x="105" y="237" class="label">Upstream model domain</text>
  <text x="105" y="261" class="small">Current KWSE job owns QFIX, FREE, TRANSFER processing, solve, and outputs.</text>

  <rect x="510" y="300" width="610" height="330" rx="18" fill="url(#down-grid)" fill-opacity="0.9" stroke="#16a34a" stroke-width="4"/>
  <text x="790" y="600" class="label">Downstream model domain</text>
  <text x="790" y="622" class="small">Completed scenario owns depth, terrain, inundation, STL, and manifest.</text>

  <path d="M180 292 C300 330 380 390 500 430 C650 480 800 500 1025 545" fill="none" stroke="#0e7490" stroke-width="30" stroke-linecap="round" opacity="0.28"/>
  <path d="M180 292 C300 330 380 390 500 430 C650 480 800 500 1025 545" fill="none" stroke="#0369a1" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="226" y="315" class="small">physical flow</text>

  <path d="M530 360 L562 382 L596 412 L632 448 L668 486" fill="none" stroke="#ea580c" stroke-width="8" stroke-dasharray="12 8"/>
  <text x="535" y="327" class="label">overlapping, run-specific STL</text>
  <text x="535" y="347" class="small">post-processed WSE contour clipped by downstream inundation</text>

  <rect x="544" y="374" width="34" height="34" fill="#fed7aa" fill-opacity="0.85" stroke="#ea580c" stroke-width="3"/>
  <circle cx="561" cy="391" r="4" fill="#ea580c"/>
  <rect x="552" y="349" width="42" height="42" fill="#bbf7d0" fill-opacity="0.72" stroke="#15803d" stroke-width="3"/>
  <circle cx="573" cy="370" r="6" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <path d="M562 374 l8 8 -8 8 -8 -8 z" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
  <path d="M594 356 C675 320 715 315 785 315" fill="none" stroke="#15803d" stroke-width="2"/>
  <text x="792" y="310" class="body">One map query, two grid cells</text>
  <path d="M562 382 H785" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M573 370 H785" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M561 391 H785" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="792" y="337" class="small">purple diamond: shared query coordinate</text>
  <text x="792" y="363" class="small">green cell and center: downstream sample</text>
  <text x="792" y="389" class="small">orange cell and center: upstream HFIX cell</text>
  <text x="792" y="416" class="mono">sampled WSE = depth + terrain</text>
  <text x="792" y="440" class="small">centers and footprints are not coincident</text>

  <text x="116" y="493" class="body">Upstream TRANSFER cell</text>
  <text x="116" y="516" class="small">STL is rasterized on the upstream grid.</text>
  <text x="116" y="537" class="small">Positive sampled WSE becomes cell-specific HFIX.</text>

  <rect x="90" y="284" width="18" height="110" fill="#2563eb" opacity="0.75"/>
  <text x="117" y="342" class="body">QFIX inflow</text>

  <path d="M675 510 H686 M686 510 V552 M686 552 H642" fill="none" stroke="#dc2626" stroke-width="7"/>
  <text x="390" y="560" class="body">FREE edge spans from downstream inundation intersection</text>

  <rect x="55" y="660" width="1090" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="78" y="687" class="label">Ownership boundary</text>
  <text x="78" y="713" class="small">Planning selects q, nominal stage, downstream source, and hot-start order.</text>
  <text x="455" y="713" class="small">Execution constructs exact inputs and publishes a manifest.</text>
  <text x="830" y="713" class="small">Observation verifies storage before materialized state.</text>

  <g transform="translate(910 198)">
    <rect width="208" height="84" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="14" y="26" class="label">Nominal target</text>
    <text x="14" y="51" class="mono">bc_value = zₖ</text>
    <text x="14" y="72" class="small">labels the scenario</text>
  </g>
</svg>
