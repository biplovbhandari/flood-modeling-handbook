<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Slope-based downstream control compared with raised known downstream water surface elevation</title>
  <desc id="desc">Two schematic longitudinal river profiles share the same falling bed and downstream flow direction. The left profile has a water surface parallel to the bed under a slope-based normal-depth reference. The right profile has a raised downstream water surface, a curved backwater profile above a dashed normal-depth reference, and an arrow showing upstream influence.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#175a86"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a3e8e"/>
    </marker>
    <style>
      .panel { fill: #fbfcfd; stroke: #5a6872; stroke-width: 2; }
      .bed { fill: none; stroke: #6c4b2a; stroke-width: 8; stroke-linecap: round; }
      .water { fill: none; stroke: #1879b8; stroke-width: 7; stroke-linecap: round; }
      .water-fill { fill: #bfe3f5; opacity: 0.62; }
      .reference { fill: none; stroke: #587a8d; stroke-width: 3; stroke-dasharray: 10 8; }
      .boundary { stroke: #c24135; stroke-width: 5; }
      .flow { stroke: #175a86; stroke-width: 4; marker-end: url(#arrow-blue); }
      .influence { stroke: #7a3e8e; stroke-width: 4; marker-end: url(#arrow-purple); }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #1f2933; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #334e5c; }
      .panel-title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #182b36; }
      .figure-title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #102a3a; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #4b3d52; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="figure-title">How downstream control changes a subcritical profile</text>
  <text x="600" y="75" text-anchor="middle" class="small">Qualitative longitudinal schematic, not measured geometry</text>

  <rect x="55" y="105" width="520" height="520" rx="12" class="panel"/>
  <rect x="625" y="105" width="520" height="520" rx="12" class="panel"/>

  <text x="315" y="145" text-anchor="middle" class="panel-title">A. Slope-based downstream control</text>
  <text x="885" y="145" text-anchor="middle" class="panel-title">B. Raised known downstream WSE</text>

  <path d="M115 300 L525 470 L525 535 L115 535 Z" fill="#eadcc6"/>
  <path d="M115 220 L525 390 L525 470 L115 300 Z" class="water-fill"/>
  <path d="M115 300 L525 470" class="bed"/>
  <path d="M115 220 L525 390" class="water"/>
  <line x1="525" y1="365" x2="525" y2="485" class="boundary"/>
  <line x1="165" y1="190" x2="315" y2="190" class="flow"/>
  <text x="240" y="178" text-anchor="middle" class="small">Discharge downstream</text>
  <text x="315" y="325" text-anchor="middle" class="label">approximately constant normal depth</text>
  <text x="505" y="350" text-anchor="end" class="small">slope supplied</text>
  <text x="505" y="372" text-anchor="end" class="small">at outflow</text>
  <text x="130" y="505" class="small">falling channel bed</text>

  <path d="M685 300 L1095 470 L1095 535 L685 535 Z" fill="#eadcc6"/>
  <path d="M685 213 C810 218 930 245 1095 295 L1095 470 L685 300 Z" class="water-fill"/>
  <path d="M685 300 L1095 470" class="bed"/>
  <path d="M685 213 C810 218 930 245 1095 295" class="water"/>
  <path d="M685 220 L1095 390" class="reference"/>
  <line x1="1095" y1="270" x2="1095" y2="485" class="boundary"/>
  <line x1="735" y1="190" x2="885" y2="190" class="flow"/>
  <text x="810" y="178" text-anchor="middle" class="small">Discharge downstream</text>
  <line x1="1025" y1="255" x2="790" y2="222" class="influence"/>
  <text x="915" y="205" text-anchor="middle" class="note">backwater influence upstream</text>
  <text x="1075" y="250" text-anchor="end" class="small">raised known WSE</text>
  <text x="840" y="335" text-anchor="middle" class="small">dashed: normal-depth reference</text>
  <text x="700" y="505" class="small">same falling channel bed</text>

  <line x1="80" y1="662" x2="115" y2="662" class="water"/>
  <text x="128" y="668" class="small">water surface</text>
  <line x1="330" y1="662" x2="365" y2="662" class="reference"/>
  <text x="378" y="668" class="small">normal-depth reference</text>
  <line x1="665" y1="662" x2="700" y2="662" class="bed"/>
  <text x="713" y="668" class="small">channel bed</text>
  <line x1="930" y1="642" x2="930" y2="682" class="boundary"/>
  <text x="944" y="668" class="small">downstream boundary</text>

  <text x="600" y="720" text-anchor="middle" class="note">The distance and magnitude of influence depend on flow regime, geometry, roughness, discharge, and the downstream control.</text>
</svg>
