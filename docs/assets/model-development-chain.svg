<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Model-development chain from prepared inputs to an addressed model directory</title>
  <desc id="desc">A left-to-right process diagram shows a prepared reach network feeding vector geometry assets, a DEM source feeding a terrain raster, and a land-cover source plus lookup feeding a roughness raster. The rasters share one exact grid, while vectors require compatible horizontal coordinates and explicit mapping to cells. The six assets and a manifest are visibly grouped as one publication set and copied sequentially to a model directory named by identity hash and domain code, with the manifest copied last. A separate review gate states that directory presence does not prove materialization or scientific adequacy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <pattern id="reviewHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#7c2d12" stroke-width="2" opacity="0.16"/>
    </pattern>
    <style>
      .title { font: 700 29px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #334155; }
      .laneTitle { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .boxTitle { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Arial, sans-serif; fill: #1e293b; }
      .small { font: 400 12px Arial, sans-serif; fill: #334155; }
      .whiteTitle { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .whiteBody { font: 400 13px Arial, sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #7c2d12; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">Model development creates artifacts, identity, and an address</text>
  <text x="600" y="72" text-anchor="middle" class="subtitle">Terrain and roughness share an exact raster grid; vectors require explicit cell mapping.</text>

  <text x="25" y="112" class="laneTitle">Prepared and realized inputs</text>

  <rect x="25" y="130" width="215" height="145" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="45" y="160" class="boxTitle">Prepared reach network</text>
  <text x="45" y="186" class="body">Target reach geometry</text>
  <text x="45" y="208" class="body">Caller-trusted topology</text>
  <text x="45" y="230" class="body">Drainage area and order</text>
  <text x="45" y="252" class="small">Plus authored geometry inputs</text>

  <rect x="25" y="315" width="215" height="125" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <text x="45" y="345" class="boxTitle">Realized DEM source</text>
  <text x="45" y="371" class="body">Caller value or process default</text>
  <text x="45" y="393" class="body">Horizontal CRS target</text>
  <text x="45" y="415" class="small">Vertical datum is not encoded</text>

  <rect x="25" y="480" width="215" height="145" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="45" y="510" class="boxTitle">Realized LULC source</text>
  <text x="45" y="536" class="body">Caller value or process default</text>
  <text x="45" y="558" class="body">Realized lookup dictionary</text>
  <text x="45" y="580" class="body">Categorical source values</text>
  <text x="45" y="602" class="small">Unmapped values can become -9999</text>

  <text x="300" y="112" class="laneTitle">Current transformations</text>

  <rect x="300" y="130" width="250" height="145" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="320" y="160" class="boxTitle">Geometry and domain</text>
  <text x="320" y="186" class="body">Estimate bankfull width</text>
  <text x="320" y="208" class="body">Construct inflow and buffers</text>
  <text x="320" y="230" class="body">Include extra geometries</text>
  <text x="320" y="252" class="small">Snap computed bbox to grid</text>

  <rect x="300" y="315" width="250" height="125" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <text x="320" y="345" class="boxTitle">Terrain extraction</text>
  <text x="320" y="371" class="body">Reproject band 1 to bbox</text>
  <text x="320" y="393" class="body">Write float32 dem.tif</text>
  <text x="320" y="415" class="small">Output checksum records bytes</text>

  <rect x="300" y="480" width="250" height="145" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="320" y="510" class="boxTitle">Roughness conversion</text>
  <text x="320" y="536" class="body">Reproject classes to same raster grid</text>
  <text x="320" y="558" class="body">Cast to uint8 and apply lookup</text>
  <text x="320" y="580" class="body">Write float32 roughness.tif</text>
  <text x="320" y="602" class="small">No missing-class warning today</text>

  <path d="M240 202 L300 202" class="arrow"/>
  <path d="M240 377 L300 377" class="arrow"/>
  <path d="M240 552 L300 552" class="arrow"/>

  <text x="610" y="112" class="laneTitle">Realized artifacts and record</text>

  <rect x="590" y="120" width="285" height="550" rx="16" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>

  <rect x="610" y="130" width="235" height="145" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <text x="630" y="160" class="boxTitle">Geometry assets</text>
  <text x="630" y="186" class="body">reach.geojson</text>
  <text x="630" y="208" class="body">inflow.geojson</text>
  <text x="630" y="230" class="body">anchor.geojson</text>
  <text x="630" y="252" class="body">domain.geojson</text>
  <text x="630" y="270" class="small">Compatible CRS; map vectors to cells</text>

  <rect x="610" y="315" width="235" height="125" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <text x="630" y="345" class="boxTitle">Raster assets</text>
  <text x="630" y="375" class="body">dem.tif</text>
  <text x="630" y="399" class="body">roughness.tif</text>
  <text x="630" y="421" class="small">Same transform, size, CRS, extent</text>

  <rect x="610" y="480" width="235" height="145" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
  <text x="630" y="510" class="boxTitle">model_manifest.json</text>
  <text x="630" y="536" class="body">Inputs and identity</text>
  <text x="630" y="558" class="body">Domain and properties</text>
  <text x="630" y="580" class="body">Asset hrefs and checksums</text>
  <text x="630" y="602" class="body">Implemented warnings</text>
  <text x="732" y="658" text-anchor="middle" class="small">Publication set: six assets plus manifest</text>

  <path d="M550 202 L610 202" class="arrow"/>
  <path d="M550 377 L610 377" class="arrow"/>
  <path d="M550 552 L575 552 L575 420 L610 420" class="arrow"/>
  <path d="M845 202 L865 202 L865 500 L845 500" class="arrow"/>
  <path d="M790 440 L790 480" class="arrow"/>

  <text x="905" y="112" class="laneTitle">Address and evidence boundary</text>

  <rect x="905" y="165" width="270" height="200" rx="16" fill="#0f766e" stroke="#115e59" stroke-width="3"/>
  <text x="1040" y="200" text-anchor="middle" class="whiteTitle">Model directory</text>
  <text x="1040" y="230" text-anchor="middle" class="whiteBody">base_output_path /</text>
  <text x="1040" y="254" text-anchor="middle" class="whiteBody">identity_hash_domain_code /</text>
  <text x="1040" y="288" text-anchor="middle" class="whiteBody">Six assets plus model manifest</text>
  <text x="1040" y="312" text-anchor="middle" class="whiteBody">Sequential asset copies</text>
  <text x="1040" y="341" text-anchor="middle" class="whiteBody">Manifest copied last</text>

  <path d="M875 645 L890 645 L890 265 L905 265" class="arrow"/>

  <rect x="905" y="435" width="270" height="190" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <rect x="905" y="435" width="270" height="190" rx="16" fill="url(#reviewHatch)"/>
  <text x="1040" y="470" text-anchor="middle" class="boxTitle">Separate evidence gate</text>
  <text x="925" y="500" class="body">Observe storage and asset integrity.</text>
  <text x="925" y="526" class="body">Review topology and provenance.</text>
  <text x="925" y="552" class="body">Review raster grid and vector mapping.</text>
  <text x="925" y="578" class="body">Review datum, boundaries, and clipping.</text>
  <text x="925" y="604" class="small">Presence alone is not adequacy.</text>

  <path d="M1040 365 L1040 435" class="dash"/>

  <rect x="25" y="688" width="1150" height="92" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="45" y="720" class="boxTitle">What the chain does not add</text>
  <text x="45" y="748" class="body">It does not add topobathymetry, structures, a vertical-datum transformation, an STL, an outflow area, a hydraulic scenario, domain expansion, or scientific acceptance.</text>
  <text x="45" y="771" class="small">Every omitted responsibility needs its own authoritative producer, artifact, and validation evidence.</text>
</svg>
