<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="grid-flux-title grid-flux-desc">
  <title id="grid-flux-title">Cell-face flux wets a dry active cell</title>
  <desc id="grid-flux-desc">Two structured-grid panels compare time n and time n plus one. In the first panel, a positive eastward flux crosses the west face of a highlighted dry active cell. In the second panel, the same cell contains thin water above an illustrative wet-state threshold. Cell centers, shared faces, inactive cells, grid spacing, and equal and opposite flux signs are labeled.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#075985"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <pattern id="inactive-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#e5e7eb"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#9ca3af" stroke-width="4"/>
    </pattern>
    <style>
      .heading { font: 700 28px system-ui, sans-serif; fill: #111827; }
      .panel-title { font: 700 23px system-ui, sans-serif; fill: #111827; }
      .label { font: 18px system-ui, sans-serif; fill: #111827; }
      .small { font: 16px system-ui, sans-serif; fill: #374151; }
      .math { font: italic 18px Georgia, serif; fill: #111827; }
      .grid { stroke: #374151; stroke-width: 2; }
      .wet { fill: #bae6fd; }
      .wet-strong { fill: #7dd3fc; }
      .dry { fill: #f3f4f6; }
      .center { fill: #111827; }
      .target { fill: none; stroke: #b45309; stroke-width: 5; stroke-dasharray: 10 7; }
      .flux { stroke: #075985; stroke-width: 5; fill: none; marker-end: url(#arrow-blue); }
      .dimension { stroke: #374151; stroke-width: 2; fill: none; marker-start: url(#arrow-gray); marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="heading">A shared face transfers water without creating volume</text>
  <text x="315" y="105" text-anchor="middle" class="panel-title">Time tⁿ: target cell is dry</text>
  <text x="885" y="105" text-anchor="middle" class="panel-title">Time tⁿ⁺¹: target cell is wet</text>

  <g aria-label="Grid at time n">
    <rect x="95" y="150" width="440" height="300" class="dry grid"/>
    <rect x="95" y="250" width="110" height="100" class="wet grid"/>
    <rect x="205" y="250" width="110" height="100" class="wet-strong grid"/>
    <rect x="315" y="250" width="110" height="100" class="dry grid"/>
    <rect x="425" y="150" width="110" height="100" fill="url(#inactive-hatch)" class="grid"/>
    <line x1="205" y1="150" x2="205" y2="450" class="grid"/>
    <line x1="315" y1="150" x2="315" y2="450" class="grid"/>
    <line x1="425" y1="150" x2="425" y2="450" class="grid"/>
    <line x1="95" y1="250" x2="535" y2="250" class="grid"/>
    <line x1="95" y1="350" x2="535" y2="350" class="grid"/>
    <rect x="315" y="250" width="110" height="100" class="target"/>

    <circle cx="150" cy="200" r="5" class="center"/>
    <circle cx="260" cy="200" r="5" class="center"/>
    <circle cx="370" cy="200" r="5" class="center"/>
    <circle cx="480" cy="200" r="5" class="center"/>
    <circle cx="150" cy="300" r="5" class="center"/>
    <circle cx="260" cy="300" r="5" class="center"/>
    <circle cx="370" cy="300" r="5" class="center"/>
    <circle cx="480" cy="300" r="5" class="center"/>
    <circle cx="150" cy="400" r="5" class="center"/>
    <circle cx="260" cy="400" r="5" class="center"/>
    <circle cx="370" cy="400" r="5" class="center"/>
    <circle cx="480" cy="400" r="5" class="center"/>

    <path d="M 260 300 L 355 300" class="flux"/>
    <text x="307" y="282" text-anchor="middle" class="math">Qₓ &gt; 0</text>
    <text x="370" y="305" text-anchor="middle" class="label">dry</text>
    <text x="370" y="329" text-anchor="middle" class="math">h &lt; hₒₙ</text>
    <text x="315" y="472" text-anchor="middle" class="small">Shared face: outflow from west cell, inflow to target</text>
    <path d="M 95 500 L 205 500" class="dimension"/>
    <text x="150" y="526" text-anchor="middle" class="math">Δx</text>
    <path d="M 62 250 L 62 350" class="dimension"/>
    <text x="42" y="306" text-anchor="middle" class="math" transform="rotate(-90 42 306)">Δy</text>
    <text x="480" y="205" text-anchor="middle" class="small">inactive</text>
  </g>

  <path d="M 555 300 L 635 300" class="flux"/>
  <text x="595" y="278" text-anchor="middle" class="small">advance one step</text>

  <g aria-label="Grid at time n plus one">
    <rect x="665" y="150" width="440" height="300" class="dry grid"/>
    <rect x="665" y="250" width="110" height="100" class="wet grid"/>
    <rect x="775" y="250" width="110" height="100" class="wet-strong grid"/>
    <rect x="885" y="250" width="110" height="100" class="wet grid"/>
    <rect x="995" y="150" width="110" height="100" fill="url(#inactive-hatch)" class="grid"/>
    <line x1="775" y1="150" x2="775" y2="450" class="grid"/>
    <line x1="885" y1="150" x2="885" y2="450" class="grid"/>
    <line x1="995" y1="150" x2="995" y2="450" class="grid"/>
    <line x1="665" y1="250" x2="1105" y2="250" class="grid"/>
    <line x1="665" y1="350" x2="1105" y2="350" class="grid"/>
    <rect x="885" y="250" width="110" height="100" class="target"/>

    <circle cx="720" cy="200" r="5" class="center"/>
    <circle cx="830" cy="200" r="5" class="center"/>
    <circle cx="940" cy="200" r="5" class="center"/>
    <circle cx="1050" cy="200" r="5" class="center"/>
    <circle cx="720" cy="300" r="5" class="center"/>
    <circle cx="830" cy="300" r="5" class="center"/>
    <circle cx="940" cy="300" r="5" class="center"/>
    <circle cx="1050" cy="300" r="5" class="center"/>
    <circle cx="720" cy="400" r="5" class="center"/>
    <circle cx="830" cy="400" r="5" class="center"/>
    <circle cx="940" cy="400" r="5" class="center"/>
    <circle cx="1050" cy="400" r="5" class="center"/>

    <path d="M 830 300 L 925 300" class="flux"/>
    <text x="877" y="282" text-anchor="middle" class="math">Qₓ &gt; 0</text>
    <text x="940" y="305" text-anchor="middle" class="label">wet</text>
    <text x="940" y="329" text-anchor="middle" class="math">h ≥ hₒₙ</text>
    <text x="885" y="472" text-anchor="middle" class="small">The target stores the received net volume</text>
    <text x="1050" y="205" text-anchor="middle" class="small">inactive</text>
  </g>

  <g aria-label="Legend and notes">
    <rect x="145" y="585" width="34" height="26" class="wet grid"/>
    <text x="191" y="605" class="label">wet active cell</text>
    <rect x="385" y="585" width="34" height="26" class="dry grid"/>
    <text x="431" y="605" class="label">dry active cell</text>
    <rect x="625" y="585" width="34" height="26" fill="url(#inactive-hatch)" class="grid"/>
    <text x="671" y="605" class="label">inactive cell</text>
    <circle cx="880" cy="598" r="5" class="center"/>
    <text x="897" y="605" class="label">cell center</text>
    <line x1="145" y1="650" x2="195" y2="650" class="flux"/>
    <text x="215" y="657" class="label">positive face-flux direction</text>
    <rect x="625" y="635" width="64" height="34" class="target"/>
    <text x="706" y="657" class="label">same target cell in both panels</text>
    <text x="600" y="718" text-anchor="middle" class="small">The threshold hₒₙ is illustrative and solver-specific, not a universal physical constant.</text>
  </g>
</svg>
