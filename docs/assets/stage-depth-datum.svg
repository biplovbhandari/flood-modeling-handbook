<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Stage, depth, and vertical datum at a channel cross-section</title>
  <desc id="desc">A schematic channel cross-section separates the physical section from a right-side elevation reference. It shows terrain, water-surface elevation, local depth, stage above a stated reference, discharge through the section, spatially varying velocity, and water-surface elevation above a vertical datum without overlapping labels.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#146b8c"/>
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#243746"/>
    </marker>
    <marker id="arrow-dark-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#243746"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #172b3a; }
      .label { font: 17px system-ui, sans-serif; fill: #172b3a; }
      .small { font: 14px system-ui, sans-serif; fill: #334e5f; }
      .strong { font: 600 17px system-ui, sans-serif; fill: #172b3a; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>
  <text x="48" y="42" class="title">Schematic channel cross-section</text>

  <rect x="42" y="68" width="630" height="450" rx="14" class="panel"/>
  <text x="62" y="98" class="strong">Physical cross-section</text>

  <path d="M70 190 C170 210 230 270 300 390 C355 470 430 478 500 405 C565 330 610 270 648 240 L648 482 L70 482 Z" fill="#dbc59e"/>
  <path d="M70 190 C170 210 230 270 300 390 C355 470 430 478 500 405 C565 330 610 270 648 240" fill="none" stroke="#6f5435" stroke-width="6"/>
  <text x="505" y="220" class="label">terrain profile, z<tspan baseline-shift="sub" font-size="12">b</tspan></text>

  <path d="M235 292 L585 292 C553 330 528 375 500 405 C430 478 355 470 300 390 C272 344 252 310 235 292 Z" fill="#9dd9ee" fill-opacity="0.82"/>
  <line x1="235" y1="292" x2="585" y2="292" stroke="#146b8c" stroke-width="6"/>
  <text x="472" y="276" class="strong">water surface, WSE</text>

  <line x1="438" y1="292" x2="438" y2="454" stroke="#243746" stroke-width="3" marker-start="url(#arrow-dark-start)" marker-end="url(#arrow-dark)"/>
  <text x="455" y="365" class="strong">depth, h</text>
  <text x="455" y="407" class="small">h = WSE - z<tspan baseline-shift="sub" font-size="10">b</tspan></text>

  <line x1="218" y1="405" x2="332" y2="405" stroke="#9a3412" stroke-width="5"/>
  <circle cx="278" cy="405" r="7" fill="#9a3412"/>
  <line x1="278" y1="405" x2="278" y2="292" stroke="#9a3412" stroke-width="3" marker-start="url(#arrow-dark-start)" marker-end="url(#arrow-dark)"/>
  <text x="82" y="370" class="strong">stage, s</text>
  <path d="M160 366 H252" fill="none" stroke="#9a3412" stroke-width="2"/>
  <text x="82" y="416" class="small">reference elevation, z<tspan baseline-shift="sub" font-size="10">r</tspan></text>
  <path d="M198 411 H218" fill="none" stroke="#9a3412" stroke-width="2"/>
  <text x="82" y="442" class="small">WSE = z<tspan baseline-shift="sub" font-size="10">r</tspan> + s</text>

  <line x1="312" y1="325" x2="565" y2="325" stroke="#146b8c" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="315" y="316" class="strong">discharge Q</text>

  <line x1="320" y1="354" x2="405" y2="354" stroke="#ffffff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="315" y1="382" x2="405" y2="382" stroke="#ffffff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="320" y1="413" x2="400" y2="413" stroke="#ffffff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="310" y="445" class="small">local velocity varies</text>

  <rect x="700" y="68" width="218" height="450" rx="14" class="panel"/>
  <text x="720" y="98" class="strong">Elevation reference</text>
  <line x1="735" y1="458" x2="885" y2="458" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="735" y="484" class="small">vertical datum: z = 0 m</text>
  <line x1="790" y1="458" x2="790" y2="292" stroke="#146b8c" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="735" y1="292" x2="885" y2="292" stroke="#146b8c" stroke-width="3"/>
  <text x="810" y="360" class="label">WSE above</text>
  <text x="810" y="383" class="label">vertical datum</text>
  <text x="735" y="275" class="strong">WSE</text>
  <rect x="724" y="130" width="170" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="742" y="159" class="small">Elevation quantities</text>
  <text x="742" y="183" class="small">need a datum.</text>
  <text x="742" y="207" class="small">Depth is a difference.</text>

  <line x1="55" y1="548" x2="905" y2="548" stroke="#d1d5db" stroke-width="1"/>
  <text x="57" y="576" class="small">Schematic only. Elevations need a stated datum; stage needs a stated reference.</text>
</svg>
