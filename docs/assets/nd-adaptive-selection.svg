<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive discharge proposal and measured verdict</title>
  <desc id="desc">A response curve begins at a labeled reference point and crosses a floor and ceiling that define a shaded discharge acceptance window. A dashed extrapolated curve predicts an in-window response at the proposed discharge. A separate measured point at the same discharge lies above the ceiling and receives an above-ceiling verdict, showing that a proposal is not a verdict.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/>
    </marker>
    <pattern id="window-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#73a9c2" stroke-width="3"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>
  <text x="70" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17212b">Adaptive discharge selection: the curve proposes, the measurement decides</text>
  <text x="70" y="86" font-family="Arial, sans-serif" font-size="16" fill="#425466">Synthetic one-metric schematic. Apply the crossing logic separately to each configured response metric.</text>

  <rect x="115" y="130" width="905" height="450" fill="#f8fafc" stroke="#c5d0db" stroke-width="2"/>

  <rect x="480" y="130" width="385" height="450" fill="#d9edf7" opacity="0.55"/>
  <rect x="480" y="130" width="385" height="450" fill="url(#window-hatch)" opacity="0.28"/>
  <text x="672" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#23566d">predicted acceptance window</text>

  <line x1="115" y1="580" x2="1045" y2="580" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="115" y1="580" x2="115" y2="108" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="580" y="636" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#243447">upstream discharge Q (m3/s)</text>
  <text x="33" y="365" text-anchor="middle" transform="rotate(-90 33 365)" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#243447">response metric</text>

  <line x1="115" y1="360" x2="1020" y2="360" stroke="#8b5a2b" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="115" y1="240" x2="1020" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="130" y="349" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#71451f">floor: enough change</text>
  <text x="130" y="228" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#71451f">ceiling: too much above here</text>

  <line x1="480" y1="580" x2="480" y2="360" stroke="#2f6f8f" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="865" y1="580" x2="865" y2="240" stroke="#2f6f8f" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="480" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#23566d">earliest floor crossing</text>
  <text x="865" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#23566d">earliest ceiling crossing</text>

  <polyline points="210,500 390,410 480,360" fill="none" stroke="#1b6f5c" stroke-width="5"/>
  <polyline points="480,360 865,240 955,210" fill="none" stroke="#1b6f5c" stroke-width="4" stroke-dasharray="12 8"/>
  <circle cx="210" cy="500" r="9" fill="#1b6f5c" stroke="#ffffff" stroke-width="3"/>
  <circle cx="390" cy="410" r="9" fill="#1b6f5c" stroke="#ffffff" stroke-width="3"/>
  <text x="210" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1b6f5c">reference</text>
  <text x="390" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1b6f5c">measured point</text>
  <text x="780" y="202" font-family="Arial, sans-serif" font-size="15" fill="#1b6f5c">dashed line: extrapolated proposal curve</text>

  <line x1="680" y1="580" x2="680" y2="170" stroke="#6b4fa1" stroke-width="3" stroke-dasharray="7 6"/>
  <polygon points="680,297 692,309 680,321 668,309" fill="#ffffff" stroke="#6b4fa1" stroke-width="4"/>
  <text x="680" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#6b4fa1">proposed Q</text>
  <text x="704" y="305" font-family="Arial, sans-serif" font-size="15" fill="#6b4fa1">predicted response inside band</text>

  <circle cx="680" cy="190" r="12" fill="#c43d3d" stroke="#7f1d1d" stroke-width="3"/>
  <line x1="694" y1="190" x2="824" y2="190" stroke="#c43d3d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="835" y="163" width="168" height="55" rx="8" fill="#fff1f1" stroke="#c43d3d" stroke-width="2"/>
  <text x="919" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9f2424">measured verdict</text>
  <text x="919" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9f2424">reject: above ceiling</text>

  <g transform="translate(125 662)">
    <circle cx="0" cy="0" r="7" fill="#1b6f5c"/>
    <text x="16" y="5" font-family="Arial, sans-serif" font-size="14" fill="#425466">measured scenario point</text>
    <polygon points="246,-9 255,0 246,9 237,0" fill="#ffffff" stroke="#6b4fa1" stroke-width="3"/>
    <text x="268" y="5" font-family="Arial, sans-serif" font-size="14" fill="#425466">curve prediction</text>
    <circle cx="445" cy="0" r="8" fill="#c43d3d"/>
    <text x="461" y="5" font-family="Arial, sans-serif" font-size="14" fill="#425466">later measurement and verdict</text>
    <rect x="717" y="-9" width="20" height="18" fill="#d9edf7" stroke="#2f6f8f"/>
    <text x="747" y="5" font-family="Arial, sans-serif" font-size="14" fill="#425466">predicted window</text>
  </g>
</svg>
