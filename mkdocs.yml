site_name: Flood Modeling Handbook
site_description: A handbook for learning hydrology, hydraulics, flood-inundation modeling, validation, and scientific software practice
site_url: https://biplovbhandari.github.io/flood-modeling-handbook/
repo_name: biplovbhandari/flood-modeling-handbook
repo_url: https://github.com/biplovbhandari/flood-modeling-handbook
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; 2026 Biplov Bhandari.
  Handbook text and original figures are licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
  Changes must be indicated.

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

